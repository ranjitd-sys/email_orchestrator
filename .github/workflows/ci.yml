name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Bun runtime
        uses: ./.github/actions/setup

      - name: Typecheck root workspace
        run: bun run typecheck

      - name: Typecheck orchestrator
        run: bun run --cwd apps/orchestrator typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Bun runtime
        uses: ./.github/actions/setup

      - name: Run Bun runtime tests
        run: bun run test:runtime

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Bun runtime
        uses: ./.github/actions/setup

      - name: Run Biome
        run: bun run lint