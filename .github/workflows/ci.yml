name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (includes SAST CodeQL and SCA Dependabot)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun runtime
        uses: ./.github/actions/setup

      - name: Typecheck root workspace
        run: bun run typecheck

      - name: Typecheck orchestrator
        run: bun run --cwd apps/orchestrator typecheck

      - name: Run Bun runtime tests
        run: bun run test:runtime

      - name: Run Biome
        run: bun run lint

      - name: Record CodeQL start
        id: codeql-start
        run: echo "time=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_OUTPUT"

      - name: Initialize CodeQL
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

      - name: Summarize CodeQL results
        id: codeql-summary
        if: always()
        uses: actions/github-script@v9
        env:
          SECURITY_TAB: ${{ github.server_url }}/${{ github.repository }}/security
          SCAN_START: ${{ steps.codeql-start.outputs.time }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const securityTab = process.env.SECURITY_TAB;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const runNumber = context.runNumber;
            const start = Number(new Date(process.env.SCAN_START));
            const elapsed = Number.isFinite(start) ? Math.max(0, Math.round((Date.now() - start) / 1000)) : 0;

            let alerts = [];
            let note = "";
            try {
              alerts = await github.paginate(github.rest.codeScanning.listAlertsForRepo, {
                owner,
                repo,
                state: "open",
                per_page: 100,
              });
            } catch (error) {
              note = `> Could not read code scanning alerts (HTTP ${error.status}). Code scanning may need to be enabled in repository settings.`;
            }

            const tags = { security: 0, maintainability: 0, reliability: 0 };
            for (const alert of alerts) {
              const ruleTags = alert.rule?.tags || [];
              if (ruleTags.includes("maintainability")) tags.maintainability++;
              else if (ruleTags.includes("reliability")) tags.reliability++;
              else tags.security++;
            }
            const finished = new Date().toISOString().slice(0, 19).replace("T", " ") + " UTC";
            const mins = Math.floor(elapsed / 60);
            const secs = elapsed % 60;
            const duration = `${mins}m ${String(secs).padStart(2, "0")}s`;

            const counts = note
              ? note.replace(/^> /, "")
              : `${tags.security} open alert(s) \u00B7 ${tags.maintainability} maintainability \u00B7 ${tags.reliability} reliability`;
            console.log(`\u{1F6E1}\uFE0F SAST (CodeQL) Analysis \u2014 \u2705 Completed ${finished} (${duration})`);
            console.log(counts);
            console.log(`View results: ${securityTab}/code-scanning`);

            const summary = core.summary
              .addHeading(`\u{1F6E1}\uFE0F SAST (CodeQL) Analysis`, 3)
              .addRaw(`\u2705 **Analysis Date/Time (UTC):** ${finished}\n`)
              .addRaw(`**Duration:** ${duration}\n`)
              .addRaw(`**Workflow Run:** [#${runNumber}](${runUrl})\n\n`);

            if (note) {
              summary.addRaw(`${note}\n\n`);
            } else {
              summary.addRaw(
                `${tags.security} open alert(s) \u00B7 ${tags.maintainability} maintainability \u00B7 ${tags.reliability} reliability\n\n`,
              );
            }

            await summary
              .addRaw(`[View results \u2192](${securityTab}/code-scanning)\n`)
              .write();
            core.setOutput("analysis_time", finished);

      - name: Summarize Dependabot results
        id: dependabot-summary
        if: always()
        uses: actions/github-script@v9
        env:
          SECURITY_TAB: ${{ github.server_url }}/${{ github.repository }}/security
        with:
          github-token: ${{ secrets.DEPENDABOT_ALERTS_TOKEN || github.token }}
          script: |
            const { owner, repo } = context.repo;
            const securityTab = process.env.SECURITY_TAB;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const runNumber = context.runNumber;
            const started = Date.now();

            let open = null;
            let closed = null;
            let note = "";
            try {
              open = await github.paginate(github.rest.dependabot.listAlertsForRepo, {
                owner,
                repo,
                state: "open",
                per_page: 100,
              });
              closed = await github.paginate(github.rest.dependabot.listAlertsForRepo, {
                owner,
                repo,
                state: "closed",
                per_page: 100,
              });
            } catch (error) {
              note = `> Could not read Dependabot alerts (HTTP ${error.status}). Ensure Dependabot alerts are enabled; reading them may require a token with Dependabot alerts read access.`;
            }
            const elapsed = Math.max(0, Math.round((Date.now() - started) / 1000));

            const finished = new Date().toISOString().slice(0, 19).replace("T", " ") + " UTC";
            const mins = Math.floor(elapsed / 60);
            const secs = elapsed % 60;
            const duration = `${mins}m ${String(secs).padStart(2, "0")}s`;

            const counts = note
              ? note.replace(/^> /, "")
              : `${open.length} open alert(s) \u00B7 ${closed.length} closed alert(s)`;
            console.log(`\u{1F4E6} SCA (Dependabot) Dependency Scan \u2014 \u2705 Completed ${finished} (${duration})`);
            console.log(counts);
            console.log(`View results: ${securityTab}/dependabot`);

            const summary = core.summary
              .addHeading(`\u{1F4E6} SCA/OSS (Dependabot) Dependency Scan`, 3)
              .addRaw(`\u2705 **Analysis Date/Time (UTC):** ${finished}\n`)
              .addRaw(`**Duration:** ${duration}\n`)
              .addRaw(`**Workflow Run:** [#${runNumber}](${runUrl})\n\n`);

            if (note) {
              summary.addRaw(`${note}\n\n`);
            } else {
              summary.addRaw(`${open.length} open alert(s) \u00B7 ${closed.length} closed alert(s)\n\n`);
            }

            await summary
              .addRaw(`[View results \u2192](${securityTab}/dependabot)\n`)
              .write();
            core.setOutput("analysis_time", finished);

      - name: Security Analysis Evidence
        if: always()
        uses: actions/github-script@v9
        env:
          CODEQL_TIME: ${{ steps.codeql-summary.outputs.analysis_time }}
          DEPENDABOT_TIME: ${{ steps.dependabot-summary.outputs.analysis_time }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const runNumber = context.runNumber;
            const codeqlTime = process.env.CODEQL_TIME || "not run";
            const dependabotTime = process.env.DEPENDABOT_TIME || "not run";
            const generated = new Date().toISOString().slice(0, 19).replace("T", " ") + " UTC";
            await core.summary
              .addHeading(`\u{1F512} Security Analysis Evidence`, 2)
              .addRaw(`**Workflow Run:** [#${runNumber}](${runUrl})  \u00B7  **Generated (UTC):** ${generated}\n\n`)
              .addTable([
                [
                  { data: "**Scan Type**", header: true },
                  { data: "**Analysis Date/Time (UTC)**", header: true },
                  { data: "**Workflow Run**", header: true },
                ],
                ["SAST (CodeQL)", codeqlTime, `#${runNumber}`],
                ["SCA/OSS (Dependabot)", dependabotTime, `#${runNumber}`],
              ])
              .addRaw(`\n_Absolute timestamps of the security analyses performed in this workflow run, for SAST (CodeQL) and SCA/OSS (Dependabot)._`)
              .write();