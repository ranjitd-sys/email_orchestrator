name: Deploy

# Pipeline: CI gate -> build+push image to GHCR -> SSH to VPS (write .env, login,
# docker compose pull + up) -> live health check.
#
# Required repo/environment secrets (Settings -> Environments -> production):
#   DEPLOY_SSH_HOST       bare VPS IPv4 (no port/scheme/whitespace)
#   DEPLOY_SSH_USER       ssh user (deploy or root) whose authorized_keys has the key
#   DEPLOY_SSH_KEY        private key PEM (passphrase-less), newlines intact
#   DATABASE_URL          prod orchestrator connection string (email_app role)
#   BREVO_WEBHOOK_SECRET  shared secret used in the webhook URL path
#   GHCR_USER             GitHub username that owns the private image (ranjitd-sys)
#   GHCR_PULL_TOKEN       PAT with read:packages (omit if the GHCR package is public)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Redeploy an existing image tag (rollback). Blank = latest sha."
        required: false

# Only one production deploy at a time; never cancel mid-deploy.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/ranjitd-sys/email_orchestrator

jobs:
  ci-gate:
    name: CI gate (typecheck + tests + lint)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: bun run typecheck
      - run: bun run --cwd apps/orchestrator typecheck
      - run: bun run test:runtime
      - run: bun run lint

  build-and-push:
    name: Build image + push to GHCR
    needs: ci-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS (pull from GHCR)
    needs: build-and-push
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v6

      - name: Ship infra files to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: /srv/email
          overwrite: true

      - name: Write .env from secrets + deploy (pull from GHCR)
        uses: appleboy/ssh-action@v1
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BREVO_WEBHOOK_SECRET: ${{ secrets.BREVO_WEBHOOK_SECRET }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          IMAGE_TAG: ${{ github.event.inputs.image_tag || github.sha }}
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DATABASE_URL,BREVO_WEBHOOK_SECRET,GHCR_USER,GHCR_PULL_TOKEN,IMAGE_TAG
          script_stop: true
          script: |
            set -euo pipefail
            mkdir -p /srv/email
            cd /srv/email
            umask 077
            {
              echo "DATABASE_URL=$DATABASE_URL"
              echo "BREVO_WEBHOOK_SECRET=$BREVO_WEBHOOK_SECRET"
              echo "PORT=3000"
            } > .env
            chmod 600 .env

            export IMAGE_TAG="${IMAGE_TAG:-latest}"
            COMPOSE="docker compose -f docker-compose.prod.yml"

            if [ -n "${GHCR_PULL_TOKEN:-}" ]; then
              echo "$GHCR_PULL_TOKEN" | docker login ghcr.io -u "${GHCR_USER:?GHCR_USER required}" --password-stdin
            fi

            echo "==> Stopping any existing orchestrator (kill old before new)"
            $COMPOSE down --remove-orphans || true

            $COMPOSE pull
            $COMPOSE run --rm --no-deps orchestrator bun run packages/db/src/migrate.ts
            $COMPOSE up -d --remove-orphans

            status=""
            for _ in $(seq 1 40); do
              status="$($COMPOSE ps --format '{{.Name}} {{.Health}}' 2>/dev/null | awk '/orchestrator/{print $2}')"
              [ "$status" = "healthy" ] && break
              sleep 2
            done
            echo "orchestrator: ${status:-unknown}"
            docker image prune -f >/dev/null 2>&1 || true

      - name: Live health check
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            curl -fsS --retry 8 --retry-delay 3 --retry-all-errors \
              https://event.deepecom.shop/health && echo
