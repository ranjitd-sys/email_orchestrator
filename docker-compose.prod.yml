name: email-orchestrator

# Orchestrator only. TLS + reverse proxy are handled by Caddy already running on
# the host (the VPS), which reverse-proxies event.deepecom.shop -> 127.0.0.1:3000.
# No Docker Caddy here, so nothing binds 80/443 from the container stack.

services:
  orchestrator:
    image: ghcr.io/ranjitd-sys/email_orchestrator:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [email-net]

networks:
  email-net:
    driver: bridge
