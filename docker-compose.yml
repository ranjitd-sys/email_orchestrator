services:
  postgres:
    image: postgres:16-alpine
    container_name: email-pg
    environment:
      POSTGRES_USER: email
      POSTGRES_PASSWORD: email
      POSTGRES_DB: email_orchestrator
    ports:
      - "5432:5432"
    volumes:
      - email-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U email -d email_orchestrator"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  email-pg-data: